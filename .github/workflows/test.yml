on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    # Windows for paths, PATHEXT shims and line endings; the checks that
    # can't differ by OS run on Linux only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Fixtures keep LF, so parity compares the bytes svelte-check reads.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The test plan diffs a PR against its merge base with the base branch.
          # Without old file contents: git fetches one when bivium reads it.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          filter: blob:none
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # `bun lint` ships in Bun 1.4.5; canary until then.
          bun-version: canary
      # The oldest Node the package supports runs the packed bin.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: bun ci

      - name: Plan tests
        # A PR runs the tests its changes can reach (bivium.config.ts); a push
        # to master skips this step, so every suite below runs in full.
        id: plan
        if: github.event_name == 'pull_request'
        run: bunx --bun bivium plan origin/${{ github.base_ref }} --github

      - name: Check the test plan can read every test's inputs
        if: runner.os == 'Linux'
        run: bunx --bun bivium check --max-unknown 0

      - name: Lint and format
        if: runner.os == 'Linux'
        run: bun run lint

      - name: Unused files, exports and dependencies
        if: runner.os == 'Linux'
        run: bun run knip

      - name: Typecheck
        if: runner.os == 'Linux'
        run: bun run typecheck

      - name: Run unit tests
        if: steps.plan.outputs.unit-tests != 'none'
        run: bun test ${{ steps.plan.outputs.unit-tests != 'all' && steps.plan.outputs.unit-tests || './tests' }}

      - name: Build
        run: bun run build

      - name: Test the packed package
        if: steps.plan.outputs.package-tests != 'none'
        run: bun run test:package
