on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    # Windows for paths, PATHEXT shims and line endings; the checks that
    # can't differ by OS run on Linux only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Fixtures keep LF, so parity compares the bytes svelte-check reads.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # `bun lint` ships in Bun 1.4.5; canary until then.
          bun-version: canary
      # The oldest Node the package supports runs the packed bin.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: bun ci

      - name: Lint and format
        if: runner.os == 'Linux'
        run: bun run lint

      - name: Unused files, exports and dependencies
        if: runner.os == 'Linux'
        run: bun run knip

      - name: Typecheck
        if: runner.os == 'Linux'
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Test the packed package
        run: bun run test:package
