on:
  pull_request:
    # What can change either tool's output on a real project.
    paths:
      - "src/**"
      - "eval/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/parity.yml"
  push:
    branches: [master]
    paths:
      - "src/**"
      - "eval/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/parity.yml"
  workflow_dispatch:

jobs:
  parity:
    # svelte-check and svelte-typecheck on real projects at pinned commits
    # (eval/projects.ts), as they are and with errors planted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary
      # svelte-check runs on Node, and npx runs each project's pnpm.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: bun ci

      # The clones and their installs, kept until a project's commit moves.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: eval/.projects
          key: parity-${{ hashFiles('eval/projects.ts') }}

      - name: Compare with svelte-check on real projects
        run: bun eval/parity.ts
